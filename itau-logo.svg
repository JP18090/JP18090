<?xml version="1.0" encoding="UTF-8"?>
<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Itaú" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Itaú</title>

  <defs>
    <clipPath id="reveal">
      <!-- revela o "itaú" da esquerda para a direita -->
      <rect x="34" y="40" width="98" height="80">
        <animate attributeName="width" dur="8s" repeatCount="indefinite"
                 values="0;0;98;98" keyTimes="0;0.45;0.68;1"/>
      </rect>
    </clipPath>
  </defs>

  <g>
    <!-- some no fim e o ciclo recomeça -->
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
             values="1;1;0" keyTimes="0;0.92;1"/>

    <!-- 1) preenchimento laranja entra -->
    <rect x="20" y="20" width="120" height="120" rx="22" fill="#EC7000">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
               values="0;0;1;1" keyTimes="0;0.28;0.45;1"/>
    </rect>

    <!-- 2) contorno sendo desenhado -->
    <rect x="20" y="20" width="120" height="120" rx="22" fill="none"
          stroke="#EC7000" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="450" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite"
               values="450;0;0" keyTimes="0;0.3;1"/>
    </rect>

    <!-- 3) marca "itaú" revelada -->
    <g clip-path="url(#reveal)">
      <text x="80" y="95" text-anchor="middle"
            font-family="'Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif"
            font-size="46" font-weight="800" fill="#050505">itaú</text>
    </g>
  </g>
</svg>
